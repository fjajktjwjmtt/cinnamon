name: Build 3DS Runner & CIA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-3ds:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install 3DS Toolchain & Packaging Tools
        run: |
          apt-get update
          apt-get install -y cmake build-essential
          dkp-pacman -Syu --noconfirm 3ds-dev

      - name: Build 3DS Runner (.3dsx)
        env:
          DEVKITPRO: /opt/devkitpro
          DEVKITARM: /opt/devkitpro/devkitARM
          PATH: /opt/devkitpro/tools/bin:/opt/devkitpro/devkitARM/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          arm-none-eabi-cmake -S . -B build/3ds -DPLATFORM=3ds -DCMAKE_BUILD_TYPE=Release
          cmake --build build/3ds

      - name: Package to CIA
        env:
          PATH: /opt/devkitpro/tools/bin:/opt/devkitpro/devkitARM/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          cd build/3ds
          3DSX_FILE=$(ls *.3dsx 2>/dev/null | head -n 1)
          SMDH_FILE=$(ls *.smdh 2>/dev/null | head -n 1)
          
          if [ -n "$3DSX_FILE" ]; then
            if [ -n "$SMDH_FILE" ]; then
              makerom -f cia -o cinnamon.cia -target t -exefslogo -icon "$SMDH_FILE"
            else
              makerom -f cia -o cinnamon.cia -target t -exefslogo
            fi
          fi

      - name: Upload 3DS Artifacts (.3dsx & .cia)
        uses: actions/upload-artifact@v4
        with:
          name: cinnamon-3ds-package
          path: |
            build/3ds/*.3dsx
            build/3ds/*.cia
            build/3ds/*.smdh

