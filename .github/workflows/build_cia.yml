name: Build 3DS Runner & Tools

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-n3ds:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Host Tools
        run: |
          apt-get update
          apt-get install -y cmake build-essential

      - name: Build 3DS Preprocessor Tool
        run: |
          cmake -S tools/n3ds-preprocess -B build/n3ds-preprocess -DCMAKE_BUILD_TYPE=Release
          cmake --build build/n3ds-preprocess

      - name: Build 3DS Runner (.3dsx)
        run: |
          cmake -S . -B build/n3ds \
            -DCMAKE_TOOLCHAIN_FILE=/opt/devkitpro/cmake/3DS.cmake \
            -DPLATFORM=n3ds \
            -DCMAKE_BUILD_TYPE=Release
          
          cmake --build build/n3ds

      - name: Upload 3DS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cinnamon-3ds-package
          path: |
            build/n3ds/*.3dsx
            build/n3ds/*.smdh
            build/n3ds-preprocess/n3ds-preprocess
