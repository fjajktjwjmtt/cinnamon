devkitpro/devkitarm コンテナには arm-none-eabi-cmake というラッパーコマンドが存在せず、devkitPro標準の3DS用CMakeツールチェーンファイル（3DS.cmake）を直接指定して cmake を呼び出す構成になっています。
修正した .github/workflows/build-3ds.yml です。
name: Build 3DS Runner

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-n3ds:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Host Tools
        run: |
          apt-get update && apt-get install -y \
            cmake \
            build-essential

      - name: Build 3DS Runner (.3dsx)
        run: |
          cmake -S . -B build/n3ds \
            -DCMAKE_TOOLCHAIN_FILE=/opt/devkitpro/cmake/3DS.cmake \
            -DPLATFORM=n3ds \
            -DCMAKE_BUILD_TYPE=Release
            
          cmake --build build/n3ds

      - name: Upload 3DS Artifacts (.3dsx)
        uses: actions/upload-artifact@v4
        with:
          name: cinnamon-3ds
          path: |
            build/n3ds/*.3dsx
            build/n3ds/*.smdh

