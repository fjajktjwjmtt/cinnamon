name: Build 3DS Runner

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-n3ds:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Host Tools
        run: |
          apt-get update
          apt-get install -y cmake build-essential

      - name: Build 3DS Runner (.3dsx)
        env:
          DEVKITPRO: /opt/devkitpro
          DEVKITARM: /opt/devkitpro/devkitARM
          # arm-none-eabi-cmake が存在するパスを強制的に通す
          PATH: /opt/devkitpro/tools/bin:/opt/devkitpro/devkitARM/bin:/opt/devkitpro/portlibs/3ds/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          arm-none-eabi-cmake -S . -B build/n3ds -DPLATFORM=n3ds -DCMAKE_BUILD_TYPE=Release
          cmake --build build/n3ds

      - name: Upload 3DS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cinnamon-3ds
          path: |
            build/n3ds/*.3dsx
            build/n3ds/*.smdh
