name: Build 3DS Runner & CIA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-3ds:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install 3DS Dev Tools
        run: |
          dkp-pacman -Syu --noconfirm 3ds-dev

      - name: Build 3DS Runner
        run: |
          make 3ds

      - name: Package to CIA
        run: |
          cd build/n3ds
          if [ -f cinnamon.3dsx ]; then
            if [ -f cinnamon.smdh ]; then
              makerom -f cia -o cinnamon.cia -target t -exefslogo -icon cinnamon.smdh
            else
              makerom -f cia -o cinnamon.cia -target t -exefslogo
            fi
          fi

      - name: Upload 3DS Artifacts (.3dsx & .cia)
        uses: actions/upload-artifact@v4
        with:
          name: cinnamon-3ds-package
          path: |
            build/n3ds/*.3dsx
            build/n3ds/*.cia
            build/n3ds/*.smdh
