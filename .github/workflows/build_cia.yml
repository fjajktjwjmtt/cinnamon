name: Build 3DS Runner

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-n3ds:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Host Tools & Dependencies
        run: |
          apt-get update && apt-get install -y \
            cmake \
            build-essential

      - name: Build Host Preprocessor
        run: |
          cmake -S tools/n3ds-preprocess -B build/n3ds-preprocess -DCMAKE_BUILD_TYPE=Release
          cmake --build build/n3ds-preprocess

      - name: Build 3DS Runner (.3dsx)
        run: |
          . /opt/devkitpro/devkitARM.sh
          
          arm-none-eabi-cmake -S . -B build/n3ds -DPLATFORM=n3ds -DCMAKE_BUILD_TYPE=Release
          cmake --build build/n3ds

      - name: Upload 3DS Artifacts (.3dsx)
        uses: actions/upload-artifact@v4
        with:
          name: cinnamon-3ds
          path: |
            build/n3ds/*.3dsx
            build/n3ds/*.smdh
