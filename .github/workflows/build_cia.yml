name: Build 3DS Runner & CIA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-3ds:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Build Tools & Dependencies
        run: |
          apt-get update
          apt-get install -y make cmake build-essential wget unzip

      - name: Download 3DS Packaging Tools (makerom & bannertool)
        run: |
          mkdir -p /tmp/tools
          
          # makerom の取得
          wget -q https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.3/makerom-v0.18.3-ubuntu_x86_64.zip -O /tmp/tools/makerom.zip
          unzip -o /tmp/tools/makerom.zip -d /usr/local/bin/
          
          # bannertool の取得
          wget -q https://github.com/carstene1ns/3ds-bannertool/releases/download/v1.2.0/bannertool-v1.2.0-ubuntu_x86_64.zip -O /tmp/tools/bannertool.zip || true
          if [ -f /tmp/tools/bannertool.zip ]; then
            unzip -o /tmp/tools/bannertool.zip -d /usr/local/bin/
          fi

          chmod +x /usr/local/bin/makerom /usr/local/bin/bannertool 2>/dev/null || true

      - name: Build 3DS Runner
        run: |
          make 3ds

      - name: Package to CIA
        run: |
          cd build/n3ds
          if [ -f cinnamon.3dsx ]; then
            if [ -f cinnamon.smdh ]; then
              makerom -f cia -o cinnamon.cia -target t -exefslogo -icon cinnamon.smdh
            else
              makerom -f cia -o cinnamon.cia -target t -exefslogo
            fi
          fi

      - name: Upload 3DS Artifacts (.3dsx & .cia)
        uses: actions/upload-artifact@v4
        with:
          name: cinnamon-3ds-package
          path: |
            build/n3ds/*.3dsx
            build/n3ds/*.cia
            build/n3ds/*.smdh
